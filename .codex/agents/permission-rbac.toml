## Critical Implementation Rules

1. **Always check permissions on the server** - Client-side checks are for UX only
2. **GENERAL admins cannot write** - Always use `canPerformWriteAction()` for mutations
3. **Use PermissionButton for all action buttons** - Ensures consistent permission handling
4. **Use ProtectedRoute for all protected pages** - Prevents unauthorized access
5. **Default to deny** - If permission is unclear, deny access
6. **Log permission failures in development** - Helps with debugging
7. **Handle backwards compatibility** - `adminLevel: undefined` should be treated as `ADMIN`

## Testing Requirements

1. Test all role combinations (ADMIN, INSTRUCTOR, SCHOOL, INDIVIDUAL)
2. Test all admin levels (MASTER, ADMIN, GENERAL)
3. Test program role permissions (OWNER, PARTNER, ASSISTANT)
4. Test write action restrictions for GENERAL admins
5. Test route protection with various auth states
6. Test PermissionButton visibility and disabled states"""
