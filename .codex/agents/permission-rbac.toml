## Hooks

### useCanAccess Hook
```typescript
import { useCallback } from 'react'
import { useAuthStore } from '@/features/auth/model/auth-store'
import {
  hasAnyRole,
  canPerformWriteAction,
  hasAdminLevelOrAbove,
  hasProgramRole,
} from '@/shared/utils/permissions'
import type { UserRole, AdminLevel, ProgramRole } from '@/types/user'

export function useCanAccess() {
  const { user } = useAuthStore()

  const canAccess = useCallback(
    (options: {
      roles?: UserRole[]
      minAdminLevel?: AdminLevel
      programId?: string
      programRole?: ProgramRole
      isWriteAction?: boolean
    }) => {
      const { roles, minAdminLevel, programId, programRole, isWriteAction } = options

      // Role check
      if (roles && !hasAnyRole(user, roles)) {
        return false
      }

      // Admin level check
      if (minAdminLevel && !hasAdminLevelOrAbove(user, minAdminLevel)) {
        return false
      }

      // Program role check
      if (programId && programRole && !hasProgramRole(user, programId, programRole)) {
        return false
      }

      // Write action check
      if (isWriteAction && !canPerformWriteAction(user)) {
        return false
      }

      return true
    },
    [user]
  )

  return { canAccess, user }
}
```

### useRequireRole Hook
```typescript
import { useEffect } from 'react'
import { useNavigate } from 'react-router-dom'
import { useAuthStore } from '@/features/auth/model/auth-store'
import { hasAnyRole } from '@/shared/utils/permissions'
import type { UserRole } from '@/types/user'

export function useRequireRole(
  requiredRoles: UserRole[],
  redirectTo: string = '/forbidden'
) {
  const { user, isAuthenticated } = useAuthStore()
  const navigate = useNavigate()

  useEffect(() => {
    if (!isAuthenticated) {
      navigate('/login', { replace: true })
      return
    }

    if (!hasAnyRole(user, requiredRoles)) {
      navigate(redirectTo, { replace: true })
    }
  }, [user, isAuthenticated, requiredRoles, redirectTo, navigate])

  return { user, hasPermission: hasAnyRole(user, requiredRoles) }
}
```

## WithRole HOC Pattern

```typescript
import type { ComponentType } from 'react'
import { Navigate } from 'react-router-dom'
import { useAuthStore } from '@/features/auth/model/auth-store'
import { hasAnyRole } from '@/shared/utils/permissions'
import type { UserRole } from '@/types/user'

export function withRole<P extends object>(
  Component: ComponentType<P>,
  allowedRoles: UserRole[],
  redirectTo: string = '/forbidden'
) {
  return function WithRoleWrapper(props: P) {
    const { user, isAuthenticated } = useAuthStore()

    if (!isAuthenticated) {
      return <Navigate to="/login" replace />
    }

    if (!hasAnyRole(user, allowedRoles)) {
      return <Navigate to={redirectTo} replace />
    }

    return <Component {...props} />
  }
}
```

## Usage Examples

### In Route Configuration
```typescript
// App.tsx or router config
<Route
  path="/admin/*"
  element={
    <ProtectedRoute requiredRoles={['ADMIN']}>
      <AdminLayout />
    </ProtectedRoute>
  }
/>

<Route
  path="/settings"
  element={
    <ProtectedRoute requiredRoles={['ADMIN']} minAdminLevel="MASTER">
      <SettingsPage />
    </ProtectedRoute>
  }
/>
```

### In Components
```typescript
// Using PermissionButton
<PermissionButton
  allowedRoles={['ADMIN']}
  isWriteAction={true}
  minAdminLevel="ADMIN"
  type="primary"
  onClick={handleCreate}
>
  생성
</PermissionButton>

// Using PermissionField
<PermissionField
  allowedRoles={['ADMIN']}
  isWriteField={true}
  readOnlyRender={() => <Text>{value}</Text>}
>
  <Input value={value} onChange={handleChange} />
</PermissionField>

// Using useCanAccess hook
function MyComponent() {
  const { canAccess } = useCanAccess()

  const canEdit = canAccess({
    roles: ['ADMIN'],
    isWriteAction: true,
  })

  const canDelete = canAccess({
    minAdminLevel: 'MASTER',
    isWriteAction: true,
  })

  return (
    <div>
      {canEdit && <Button onClick={handleEdit}>수정</Button>}
      {canDelete && <Button danger onClick={handleDelete}>삭제</Button>}
    </div>
  )
}
```

### In Form Pages
```typescript
function ProgramEditPage() {
  const { user } = useAuthStore()
  const { canAccess } = useCanAccess()

  // Show info banner for GENERAL admins
  const showReadOnlyBanner = isGeneralAdmin(user)

  // Disable form submit for GENERAL admins
  const canSubmit = canAccess({ isWriteAction: true })

  return (
    <div>
      {showReadOnlyBanner && <PermissionInfo />}

      <Form onFinish={handleSubmit}>
        {/* Form fields */}

        <PermissionButton
          type="primary"
          htmlType="submit"
          isWriteAction={true}
          disabled={!canSubmit}
        >
          저장
        </PermissionButton>
      </Form>
    </div>
  )
}
