## Permission Utility Functions (`shared/utils/permissions.ts`)

### Basic Role Checks
```typescript
import type { User, UserRole, AdminLevel, ProgramRole } from '@/types/user'

/**
 * Check if user has a specific role
 */
export function hasRole(user: Omit<User, 'password'> | null, role: UserRole): boolean {
  if (!user) return false
  return user.role === role
}

/**
 * Check if user has any of the specified roles
 */
export function hasAnyRole(user: Omit<User, 'password'> | null, roles: UserRole[]): boolean {
  if (!user || roles.length === 0) return false
  return roles.includes(user.role)
}

/**
 * Check if user is an admin
 */
export function isAdmin(user: Omit<User, 'password'> | null): boolean {
  return hasRole(user, 'ADMIN')
}

/**
 * Check if user is a master admin
 */
export function isMasterAdmin(user: Omit<User, 'password'> | null): boolean {
  return Boolean(user && user.role === 'ADMIN' && user.adminLevel === 'MASTER')
}

/**
 * Check if user is a general admin (read-only)
 */
export function isGeneralAdmin(user: Omit<User, 'password'> | null): boolean {
  return Boolean(user && user.role === 'ADMIN' && user.adminLevel === 'GENERAL')
}
```

### Admin Level Checks
```typescript
/**
 * Check if user has specific admin level
 */
export function hasAdminLevel(
  user: Omit<User, 'password'> | null,
  adminLevel: AdminLevel
): boolean {
  return Boolean(user && user.role === 'ADMIN' && user.adminLevel === adminLevel)
}

/**
 * Check if user has admin level at or above minimum
 */
export function hasAdminLevelOrAbove(
  user: Omit<User, 'password'> | null,
  minLevel: AdminLevel
): boolean {
  if (!user || user.role !== 'ADMIN') return false

  const levelHierarchy: Record<AdminLevel, number> = {
    MASTER: 3,
    ADMIN: 2,
    GENERAL: 1,
  }

  return (levelHierarchy[user.adminLevel || 'GENERAL'] || 0) >= levelHierarchy[minLevel]
}

/**
 * Check if user can perform write actions (create/update/delete)
 * GENERAL admins cannot perform write actions
 */
export function canPerformWriteAction(user: Omit<User, 'password'> | null): boolean {
  if (!user) return false
  if (user.role !== 'ADMIN') return false

  const adminLevel = user.adminLevel

  // GENERAL is explicitly restricted
  if (adminLevel === 'GENERAL') return false

  // MASTER, ADMIN, or undefined (backwards compatibility)
  return adminLevel === 'MASTER' || adminLevel === 'ADMIN' || !adminLevel
}
```

### Program Role Checks
```typescript
/**
 * Check if user has specific program role
 */
export function hasProgramRole(
  user: Omit<User, 'password'> | null,
  programId: string,
  programRole: ProgramRole
): boolean {
  if (!user || user.role !== 'ADMIN') return false
  return user.programRoles?.[programId] === programRole
}
```

### Role Hierarchy Comparison
```typescript
/**
 * Check if role1 is higher than role2
 */
export function hasHigherRole(role1: UserRole, role2: UserRole): boolean {
  const roleHierarchy: Record<UserRole, number> = {
    ADMIN: 4,
    INSTRUCTOR: 3,
    SCHOOL: 2,
    INDIVIDUAL: 1,
  }
  return (roleHierarchy[role1] || 0) > (roleHierarchy[role2] || 0)
}

/**
 * Check if role1 is equal to or higher than role2
 */
export function hasEqualOrHigherRole(role1: UserRole, role2: UserRole): boolean {
  const roleHierarchy: Record<UserRole, number> = {
    ADMIN: 4,
    INSTRUCTOR: 3,
    SCHOOL: 2,
    INDIVIDUAL: 1,
  }
  return (roleHierarchy[role1] || 0) >= (roleHierarchy[role2] || 0)
}
```

## Protected Route Component (`shared/components/protected-route.tsx`)

```typescript
import { Navigate, useLocation, useParams } from 'react-router-dom'
import { Spin } from 'antd'
import { useAuthStore } from '@/features/auth/model/auth-store'
import { canAccessPath } from '@/shared/config/menu-config'
import { canAccessProgram } from '@/shared/utils/program-acl'
import type { UserRole } from '@/types/user'

interface ProtectedRouteProps {
  children: React.ReactNode
  requiredRoles?: UserRole[]
  requireAuth?: boolean
}

export function ProtectedRoute({
  children,
  requiredRoles,
  requireAuth = true,
}: ProtectedRouteProps) {
  const { isAuthenticated, user, loading } = useAuthStore()
  const location = useLocation()
  const params = useParams()

  // Loading state
  if (loading) {
    return (
      <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh' }}>
        <Spin size="large" />
      </div>
    )
  }

  // Auth check
  if (requireAuth && !isAuthenticated) {
    return <Navigate to="/login" replace />
  }

  // MFA check for admins
  if (requireAuth && user?.role === 'ADMIN' && requiresMfa && !mfaState?.isVerified) {
    return <Navigate to="/login" replace />
  }

  // Role check
  if (requiredRoles && requiredRoles.length > 0 && user) {
    const hasRequiredRole = requiredRoles.includes(user.role)
    if (!hasRequiredRole) {
      return <Navigate to="/forbidden" replace />
    }
  }

  // Menu-based path access control
  if (user && !canAccessPath(location.pathname, user.role)) {
    return <Navigate to="/forbidden" replace />
  }

  // Program-level ACL check
  const programId = params.id || params.programId
  if (user && programId && location.pathname.includes('/programs/')) {
    const action = location.pathname.includes('/edit') ? 'EDIT' : 'VIEW'
    if (!canAccessProgram(user, programId, action)) {
      return <Navigate to="/forbidden" replace />
    }
  }

  return <>{children}</>
}
```

## Permission Button Component (`shared/components/permission-button.tsx`)

```typescript
import { Button } from 'antd'
import type { ComponentProps } from 'react'
import { useAuthStore } from '@/features/auth/model/auth-store'
import { hasAnyRole, canPerformWriteAction, hasAdminLevelOrAbove } from '@/shared/utils/permissions'
import type { UserRole, AdminLevel } from '@/types/user'

export interface PermissionButtonProps extends ComponentProps<typeof Button> {
  /** Allowed roles (empty = all roles allowed) */
  allowedRoles?: UserRole[]
  /** Hide button if no permission (default: true) */
  hideIfNoPermission?: boolean
  /** Is this a write action? (GENERAL admins cannot write) */
  isWriteAction?: boolean
  /** Minimum admin level required */
  minAdminLevel?: AdminLevel
}

export function PermissionButton({
  allowedRoles,
  hideIfNoPermission = true,
  isWriteAction = false,
  minAdminLevel,
  disabled,
  ...props
}: PermissionButtonProps) {
  const { user } = useAuthStore()

  // Role check
  const hasRolePermission = allowedRoles ? hasAnyRole(user, allowedRoles) : true

  // Write action check (GENERAL restriction)
  const canWrite = isWriteAction ? canPerformWriteAction(user) : true

  // Admin level check
  const hasAdminLevelPermission = minAdminLevel ? hasAdminLevelOrAbove(user, minAdminLevel) : true

  const hasPermission = hasRolePermission && canWrite && hasAdminLevelPermission

  // Hide if no permission
  if (!hasPermission && hideIfNoPermission) {
    return null
  }

  // Disable if no permission
  return <Button {...props} disabled={disabled || !hasPermission} />
}
```

## Permission Field Component (`shared/components/permission-field.tsx`)

```typescript
import { useAuthStore } from '@/features/auth/model/auth-store'
import { hasAnyRole, canPerformWriteAction } from '@/shared/utils/permissions'
import type { UserRole } from '@/types/user'

export interface PermissionFieldProps {
  children: React.ReactNode
  /** Allowed roles for viewing */
  allowedRoles?: UserRole[]
  /** Is this a write field? (GENERAL admins see read-only) */
  isWriteField?: boolean
  /** Render function for read-only mode */
  readOnlyRender?: () => React.ReactNode
}

export function PermissionField({
  children,
  allowedRoles,
  isWriteField = false,
  readOnlyRender,
}: PermissionFieldProps) {
  const { user } = useAuthStore()

  const hasRolePermission = allowedRoles ? hasAnyRole(user, allowedRoles) : true

  // If no role permission, hide field
  if (!hasRolePermission) {
    return null
  }

  // If write field and user cannot write, show read-only version
  if (isWriteField && !canPerformWriteAction(user)) {
    return readOnlyRender ? <>{readOnlyRender()}</> : null
  }

  return <>{children}</>
}
```

