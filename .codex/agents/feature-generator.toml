### 2. Feature Layer (features/{name}/)

#### Zustand Store (`model/{feature-name}-store.ts`)
```typescript
/**
 * {FeatureName} Zustand 스토어
 * Phase X.X: 상태 관리
 */

import { create } from 'zustand'
import type { {EntityName} } from '@/types/domain'
import { {entityName}Service } from '@/entities/{entity-name}/api/{entity-name}-service'

interface {FeatureName}State {
  items: {EntityName}[]
  selectedItem: {EntityName} | null
  loading: boolean
  error: Error | null
  fetchItems: () => Promise<void>
  fetchItemById: (id: string) => Promise<void>
  createItem: (data: Omit<{EntityName}, 'id' | 'createdAt' | 'updatedAt'>) => Promise<void>
  updateItem: (id: string, data: Partial<Omit<{EntityName}, 'id' | 'createdAt'>>) => Promise<void>
  deleteItem: (id: string) => Promise<void>
  setSelectedItem: (item: {EntityName} | null) => void
  clearError: () => void
}

export const use{FeatureName}Store = create<{FeatureName}State>(set => ({
  items: [],
  selectedItem: null,
  loading: false,
  error: null,

  fetchItems: async () => {
    set({ loading: true, error: null })
    try {
      const items = await {entityName}Service.getAll()
      set({ items, loading: false })
    } catch (error) {
      set({ error: error as Error, loading: false })
    }
  },

  fetchItemById: async (id: string) => {
    set({ loading: true, error: null })
    try {
      const item = await {entityName}Service.getById(id)
      set({ selectedItem: item, loading: false })
    } catch (error) {
      set({ error: error as Error, loading: false })
    }
  },

  createItem: async (data) => {
    set({ loading: true, error: null })
    try {
      const newItem = await {entityName}Service.create(data)
      set(state => ({
        items: [...state.items, newItem],
        loading: false,
      }))
    } catch (error) {
      set({ error: error as Error, loading: false })
      throw error
    }
  },

  updateItem: async (id, data) => {
    set({ loading: true, error: null })
    try {
      const updatedItem = await {entityName}Service.update(id, data)
      set(state => ({
        items: state.items.map(item => (item.id === id ? updatedItem : item)),
        selectedItem: state.selectedItem?.id === id ? updatedItem : state.selectedItem,
        loading: false,
      }))
    } catch (error) {
      set({ error: error as Error, loading: false })
      throw error
    }
  },

  deleteItem: async (id) => {
    set({ loading: true, error: null })
    try {
      await {entityName}Service.delete(id)
      set(state => ({
        items: state.items.filter(item => item.id !== id),
        selectedItem: state.selectedItem?.id === id ? null : state.selectedItem,
        loading: false,
      }))
    } catch (error) {
      set({ error: error as Error, loading: false })
      throw error
    }
  },

  setSelectedItem: (item) => set({ selectedItem: item }),
  clearError: () => set({ error: null }),
}))
```

#### Service Hook (`hooks/use-{feature-name}-service.ts`)
```typescript
/**
 * {FeatureName} 서비스 훅
 * Phase X.X: 서비스 레이어 훅 래핑
 */

import { useState, useCallback } from 'react'
import { {entityName}Service } from '@/entities/{entity-name}/api/{entity-name}-service'
import type { {EntityName} } from '@/types/domain'

export interface Use{FeatureName}ServiceReturn {
  loading: boolean
  error: Error | null
  getAll: () => Promise<{EntityName}[]>
  getById: (id: string) => Promise<{EntityName}>
  create: (data: Omit<{EntityName}, 'id' | 'createdAt' | 'updatedAt'>) => Promise<{EntityName}>
  update: (id: string, data: Partial<Omit<{EntityName}, 'id' | 'createdAt'>>) => Promise<{EntityName}>
  delete: (id: string) => Promise<void>
  getNameById: (id: string) => string
  getByIdSync: (id: string) => {EntityName} | undefined
  getAllSync: () => {EntityName}[]
}

export function use{FeatureName}Service(): Use{FeatureName}ServiceReturn {
  const [loading, setLoading] = useState(false)
  const [error, setError] = useState<Error | null>(null)

  const withLoading = useCallback(async <T>(fn: () => Promise<T>): Promise<T> => {
    setLoading(true)
    setError(null)
    try {
      return await fn()
    } catch (err) {
      const error = err as Error
      setError(error)
      throw error
    } finally {
      setLoading(false)
    }
  }, [])

  return {
    loading,
    error,
    getAll: useCallback(() => withLoading(() => {entityName}Service.getAll()), [withLoading]),
    getById: useCallback((id: string) => withLoading(() => {entityName}Service.getById(id)), [withLoading]),
    create: useCallback((data) => withLoading(() => {entityName}Service.create(data)), [withLoading]),
    update: useCallback((id, data) => withLoading(() => {entityName}Service.update(id, data)), [withLoading]),
    delete: useCallback((id) => withLoading(() => {entityName}Service.delete(id)), [withLoading]),
    getNameById: useCallback((id: string) => {entityName}Service.getNameById(id), []),
    getByIdSync: useCallback((id: string) => {entityName}Service.getByIdSync(id), []),
    getAllSync: useCallback(() => {entityName}Service.getAllSync(), []),
  }
}
```

#### Table Hook (`model/use-{feature-name}-table.ts`)
```typescript
/**
 * {FeatureName} 테이블 훅
 * Phase X.X: 테이블 + 쿼리 동기화
 */

import { useMemo } from 'react'
import type { ColumnDef } from '@tanstack/react-table'
import { useTableWithQuery } from '@/shared/hooks/use-table-with-query'
import type { {EntityName} } from '@/types/domain'
import { formatDate } from '@jakorea/utils'

const FILTER_KEYS = ['status', 'search'] as const

export function use{FeatureName}Table(data: {EntityName}[]) {
  const columns = useMemo<ColumnDef<{EntityName}>[]>(
    () => [
      {
        accessorKey: 'name',
        header: '이름',
        cell: ({ row }) => row.original.name,
      },
      {
        accessorKey: 'status',
        header: '상태',
        cell: ({ row }) => row.original.status,
        filterFn: (row, columnId, filterValue) => {
          if (!filterValue) return true
          return row.getValue(columnId) === filterValue
        },
      },
      {
        accessorKey: 'createdAt',
        header: '등록일',
        cell: ({ row }) => formatDate(row.original.createdAt),
      },
    ],
    []
  )

  return useTableWithQuery({
    data,
    columns,
    filterKeys: [...FILTER_KEYS],
    defaultPageSize: 10,
  })
}
```

#### Form Component (`ui/{feature-name}-form.tsx`)
```typescript
/**
 * {FeatureName} 등록/수정 폼 컴포넌트
 * Phase X.X: Ant Design + React Hook Form + Zod
 */

import { Form, Input, Select, Button, Space } from 'antd'
import { useForm } from 'react-hook-form'
import { zodResolver } from '@hookform/resolvers/zod'
import { {entityName}Schema, type {EntityName}FormData } from '@/entities/{entity-name}/model/schema'
import type { {EntityName} } from '@/types/domain'

const { Option } = Select
const { TextArea } = Input

interface {FeatureName}FormProps {
  item?: {EntityName}
  onSubmit: (data: {EntityName}FormData) => Promise<void>
  onCancel: () => void
  loading?: boolean
}

const statusOptions = [
  { value: 'active', label: '활성' },
  { value: 'pending', label: '대기' },
  { value: 'inactive', label: '비활성' },
  { value: 'completed', label: '완료' },
  { value: 'cancelled', label: '취소' },
]

export function {FeatureName}Form({ item, onSubmit, onCancel, loading }: {FeatureName}FormProps) {
  const {
    handleSubmit,
    formState: { errors },
    setValue,
    watch,
  } = useForm<{EntityName}FormData>({
    resolver: zodResolver({entityName}Schema),
    mode: 'onBlur',
    defaultValues: item
      ? {
          name: item.name,
          status: item.status,
          description: item.description || '',
        }
      : {
          name: '',
          status: 'pending',
          description: '',
        },
  })

  return (
    <Form layout="vertical" onFinish={handleSubmit(onSubmit)}>
      <Form.Item
        label="이름"
        validateStatus={errors.name ? 'error' : ''}
        help={errors.name?.message}
        required
      >
        <Input
          value={watch('name') || ''}
          onChange={e => setValue('name', e.target.value, { shouldValidate: true })}
          placeholder="이름을 입력해주세요"
        />
      </Form.Item>

      <Form.Item
        label="상태"
        validateStatus={errors.status ? 'error' : ''}
        help={errors.status?.message}
        required
      >
        <Select
          value={watch('status')}
          onChange={value => setValue('status', value, { shouldValidate: true })}
          placeholder="상태 선택"
        >
          {statusOptions.map(status => (
            <Option key={status.value} value={status.value}>
              {status.label}
            </Option>
          ))}
        </Select>
      </Form.Item>

      <Form.Item label="설명">
        <TextArea
          value={watch('description') || ''}
          onChange={e => setValue('description', e.target.value)}
          rows={4}
          placeholder="설명을 입력해주세요"
        />
      </Form.Item>

      <Form.Item>
        <Space>
          <Button type="primary" htmlType="submit" loading={loading}>
            {item ? '수정' : '등록'}
          </Button>
          <Button onClick={onCancel}>취소</Button>
        </Space>
      </Form.Item>
    </Form>
  )
}
```

#### List Component (`ui/{feature-name}-list.tsx`)
```typescript
/**
 * {FeatureName} 목록 컴포넌트
 * Phase X.X: 테이블 리스트
 */

import { Table, Button, Space, Input, Select } from 'antd'
import { PlusOutlined, SearchOutlined } from '@ant-design/icons'
import { flexRender } from '@tanstack/react-table'
import { use{FeatureName}Table } from '../model/use-{feature-name}-table'
import { use{FeatureName}Store } from '../model/{feature-name}-store'
import type { {EntityName} } from '@/types/domain'

const { Option } = Select

interface {FeatureName}ListProps {
  onAdd?: () => void
  onEdit?: (item: {EntityName}) => void
  onDelete?: (id: string) => void
}

export function {FeatureName}List({ onAdd, onEdit, onDelete }: {FeatureName}ListProps) {
  const { items, loading } = use{FeatureName}Store()
  const { table, columnFilters, resetFilters } = use{FeatureName}Table(items)

  const statusFilter = columnFilters.find(f => f.id === 'status')?.value as string | undefined

  return (
    <div>
      <Space style={{ marginBottom: 16, width: '100%', justifyContent: 'space-between' }}>
        <Space>
          <Input
            placeholder="검색..."
            prefix={<SearchOutlined />}
            value={columnFilters.find(f => f.id === 'search')?.value as string || ''}
            onChange={e => table.getColumn('search')?.setFilterValue(e.target.value || undefined)}
            style={{ width: 200 }}
          />
          <Select
            placeholder="상태 선택"
            value={statusFilter}
            onChange={value => table.getColumn('status')?.setFilterValue(value || undefined)}
            allowClear
            style={{ width: 120 }}
          >
            <Option value="active">활성</Option>
            <Option value="pending">대기</Option>
            <Option value="inactive">비활성</Option>
          </Select>
          <Button onClick={resetFilters}>초기화</Button>
        </Space>
        {onAdd && (
          <Button type="primary" icon={<PlusOutlined />} onClick={onAdd}>
            등록
          </Button>
        )}
      </Space>

      <Table
        loading={loading}
        dataSource={table.getRowModel().rows.map(row => row.original)}
        rowKey="id"
        pagination={{
          current: table.getState().pagination.pageIndex + 1,
          pageSize: table.getState().pagination.pageSize,
          total: table.getFilteredRowModel().rows.length,
          onChange: (page, pageSize) => {
            table.setPageIndex(page - 1)
            if (pageSize) table.setPageSize(pageSize)
          },
        }}
        columns={table.getAllColumns().map(column => ({
          key: column.id,
          title: flexRender(column.columnDef.header, { column } as any),
          dataIndex: column.id,
          render: (_: any, record: {EntityName}) => {
            const row = table.getRowModel().rows.find(r => r.original.id === record.id)
            if (!row) return null
            const cell = row.getVisibleCells().find(c => c.column.id === column.id)
            if (!cell) return null
            return flexRender(cell.column.columnDef.cell, cell.getContext())
          },
        }))}
      />
    </div>
  )
}
```

### 3. Page Layer (pages/{feature-name}/)

#### List Page (`{feature-name}-list-page.tsx`)
```typescript
/**
 * {FeatureName} 목록 페이지
 */

import { useEffect, useState } from 'react'
import { Typography, message } from 'antd'
import { {FeatureName}List } from '@/features/{feature-name}/ui/{feature-name}-list'
import { {FeatureName}Form } from '@/features/{feature-name}/ui/{feature-name}-form'
import { use{FeatureName}Store } from '@/features/{feature-name}/model/{feature-name}-store'
import { BaseDetailDrawer } from '@/shared/ui/base-detail-drawer'
import type { {EntityName} } from '@/types/domain'

const { Title } = Typography

export function {FeatureName}ListPage() {
  const { fetchItems, createItem, updateItem, deleteItem } = use{FeatureName}Store()
  const [drawerOpen, setDrawerOpen] = useState(false)
  const [editingItem, setEditingItem] = useState<{EntityName} | undefined>()

  useEffect(() => {
    fetchItems()
  }, [fetchItems])

  const handleAdd = () => {
    setEditingItem(undefined)
    setDrawerOpen(true)
  }

  const handleEdit = (item: {EntityName}) => {
    setEditingItem(item)
    setDrawerOpen(true)
  }

  const handleSubmit = async (data: any) => {
    try {
      if (editingItem) {
        await updateItem(editingItem.id, data)
        message.success('수정되었습니다')
      } else {
        await createItem(data)
        message.success('등록되었습니다')
      }
      setDrawerOpen(false)
    } catch (error) {
      message.error('저장에 실패했습니다')
    }
  }

  const handleDelete = async (id: string) => {
    try {
      await deleteItem(id)
      message.success('삭제되었습니다')
    } catch (error) {
      message.error('삭제에 실패했습니다')
    }
  }

  return (
    <div style={{ padding: 24 }}>
      <Title level={2}>{FeatureName} 관리</Title>

      <{FeatureName}List
        onAdd={handleAdd}
        onEdit={handleEdit}
        onDelete={handleDelete}
      />

      <BaseDetailDrawer
        open={drawerOpen}
        onClose={() => setDrawerOpen(false)}
        title={editingItem ? '{FeatureName} 수정' : '{FeatureName} 등록'}
        width={600}
      >
        <{FeatureName}Form
          item={editingItem}
          onSubmit={handleSubmit}
          onCancel={() => setDrawerOpen(false)}
        />
      </BaseDetailDrawer>
    </div>
  )
}
```

## Naming Conventions

| Type | Convention | Example |
|------|------------|---------|
| Feature folder | kebab-case | `instructor-application` |
| Component | PascalCase | `InstructorApplicationForm` |
| Hook | camelCase with `use` prefix | `useInstructorApplication` |
| Store | camelCase with `use` + `Store` suffix | `useInstructorApplicationStore` |
| Service | camelCase with `Service` suffix | `instructorApplicationService` |
| Schema | camelCase with `Schema` suffix | `instructorApplicationSchema` |
| Type | PascalCase | `InstructorApplication` |

## File Structure Template

When generating a new feature `{feature-name}`:

```
apps/cms/src/
├── entities/{entity-name}/
│   ├── api/
│   │   └── {entity-name}-service.ts
│   └── model/
│       └── schema.ts
├── features/{feature-name}/
│   ├── hooks/
│   │   └── use-{feature-name}-service.ts
│   ├── model/
│   │   ├── {feature-name}-store.ts
│   │   └── use-{feature-name}-table.ts
│   ├── ui/
│   │   ├── {feature-name}-form.tsx
│   │   └── {feature-name}-list.tsx
│   └── lib/
│       └── {feature-name}-helpers.ts (optional)
└── pages/{feature-name}/
    └── {feature-name}-list-page.tsx
```

## Usage Instructions

When asked to create a new feature:

1. Ask for the feature name (e.g., "voucher", "certificate")
2. Ask for the main entity fields
3. Generate all required files following the templates above
4. Update the domain types in `@/types/domain.ts` if needed
5. Add route configuration in `App.tsx` or router config

## Important Notes

- Always use Korean for user-facing strings (labels, messages, placeholders)
- Use English for code (variable names, function names, comments)
- Follow the existing import alias pattern (`@/` for src root)
- Include JSDoc comments with Phase information
- Handle loading and error states consistently
- Use Ant Design components for UI consistency"""
