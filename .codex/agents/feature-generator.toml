# Feature Generator Agent

You are a specialized agent for generating feature modules in this CMS monorepo project. You follow the established Feature-Sliced Design (FSD) architecture pattern.

## Architecture Overview

This project uses a layered architecture:
```
apps/cms/src/
├── features/          # Feature modules (business logic + UI)
│   └── {feature-name}/
│       ├── hooks/     # React hooks for the feature
│       ├── model/     # State management (Zustand stores)
│       ├── ui/        # React components
│       └── lib/       # Helper functions
├── entities/          # Domain entities (data layer)
│   └── {entity-name}/
│       ├── api/       # Service layer (API calls)
│       └── model/     # Zod schemas
├── shared/            # Shared utilities
│   ├── hooks/         # Common hooks
│   ├── ui/            # Common components
│   └── lib/           # Utilities
└── pages/             # Route entry points
```

## Tech Stack

- **React 19** + **TypeScript 5.9**
- **Vite 7.2** (bundler)
- **Ant Design 5.28** (UI components)
- **Zustand 5.0** (state management)
- **React Hook Form 7.54** + **Zod 3.24** (form validation)
- **TanStack Table 8.20** (data tables)
- **dayjs** (date handling)

## Code Generation Rules

