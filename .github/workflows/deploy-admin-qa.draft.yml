# DRAFT: do not merge/run until QA_ADMIN_DEPLOY_ROLE_ARN and target permissions are verified.
name: Deploy Admin QA

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: admin-qa-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: '264015108093'
  AWS_ROLE_ARN: ${{ vars.QA_ADMIN_DEPLOY_ROLE_ARN }}
  ADMIN_BUCKET: ja-prod-frontend-admin-264015108093
  ADMIN_DISTRIBUTION_ID: E2DGTFXBDMZU0O
  VITE_API_BASE_URL: https://d3r1iaa0sy4tcq.cloudfront.net
  VITE_HOMEPAGE_API_BASE_URL: https://d388j6f4woncqy.cloudfront.net
  NODE_OPTIONS: --max-old-space-size=5120

jobs:
  deploy:
    name: Build and deploy QA Admin from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Check required QA configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ROLE_ARN:-}" || { echo 'QA_ADMIN_DEPLOY_ROLE_ARN=MISSING'; exit 1; }
          test "$ADMIN_BUCKET" = 'ja-prod-frontend-admin-264015108093'
          test "$ADMIN_DISTRIBUTION_ID" = 'E2DGTFXBDMZU0O'
          echo 'QA_ADMIN_CONFIG=PASS'

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Build Admin for QA
        run: pnpm --filter admin build

      - name: Verify Admin bundle destinations
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/admin/dist/index.html
          grep -RqlF "$VITE_API_BASE_URL" apps/admin/dist/assets
          grep -RqlF "$VITE_HOMEPAGE_API_BASE_URL" apps/admin/dist/assets
          echo 'QA_ADMIN_BUNDLE_ORIGINS=PASS'

      - name: Assume dedicated QA Admin deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-admin-qa-deploy

      - name: Verify AWS identity and deployment targets
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws s3api head-bucket --bucket "$ADMIN_BUCKET"
          ORIGINS="$(aws cloudfront get-distribution \
            --id "$ADMIN_DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.Origins.Items[].DomainName' \
            --output text)"
          echo "$ORIGINS" | grep -F "$ADMIN_BUCKET" >/dev/null
          echo 'QA_ADMIN_AWS_TARGETS=PASS'

      - name: Back up existing Admin index
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "s3://$ADMIN_BUCKET/index.html" ./admin-index-before.html --no-progress
          test -s admin-index-before.html

      - name: Preserve rollback index as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-admin-index-before-deploy
          path: admin-index-before.html
          retention-days: 30
          if-no-files-found: error

      - name: Upload Admin assets without deleting old files
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync apps/admin/dist/ "s3://$ADMIN_BUCKET/" \
            --exclude 'index.html' \
            --no-progress \
            --cache-control 'public,max-age=0,must-revalidate'

      - name: Publish new Admin index
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp apps/admin/dist/index.html "s3://$ADMIN_BUCKET/index.html" \
            --no-progress \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8'

      - name: Invalidate Admin CloudFront cache
        shell: bash
        run: |
          set -euo pipefail
          ID="$(aws cloudfront create-invalidation \
            --distribution-id "$ADMIN_DISTRIBUTION_ID" \
            --paths '/*' --query 'Invalidation.Id' --output text)"
          test -n "$ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$ADMIN_DISTRIBUTION_ID" --id "$ID"
          echo 'QA_ADMIN_CF_INVALIDATION=PASS'
