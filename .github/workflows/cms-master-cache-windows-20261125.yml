name: CMS master reference caches - trusted Windows regression

on:
  push:
    branches:
      - fix/cms-master-cache-20261124
    paths:
      - 'apps/cms/**'
      - 'packages/rich-text/**'
      - '.github/workflows/cms-master-cache-windows-20261125.yml'

permissions:
  contents: read

concurrency:
  group: cms-master-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  NODE_OPTIONS: --max-old-space-size=5120
  VITE_API_BASE_URL: https://example.invalid
  VITE_HOMEPAGE_API_BASE_URL: https://example.invalid
  VITE_OAUTH_BACKEND_ORIGIN: https://example.invalid
  VITE_PLATFORM_PUBLIC_ORIGIN: https://example.invalid
  VITE_ADDRESS_API_KEY: ci-placeholder
  VITE_NEIS_API_KEY: ci-placeholder
  VITE_CAREER_NET_API_KEY: ci-placeholder

jobs:
  targeted:
    if: github.repository == 'tintolab-development/jakorea' && github.ref == 'refs/heads/fix/cms-master-cache-20261124' && github.event_name == 'push'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 45
    defaults:
      run:
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -Command ". ''{0}''"'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact revision and no production credentials
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'tintolab-development/jakorea' -or $env:GITHUB_REF -ne 'refs/heads/fix/cms-master-cache-20261124' -or $env:GITHUB_EVENT_NAME -ne 'push') { throw 'Unexpected source' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Wrong revision' }
          foreach ($key in @('AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_SESSION_TOKEN','AWS_PROFILE')) {
            if ([Environment]::GetEnvironmentVariable($key)) { throw "Unsafe AWS environment: $key" }
          }
          git diff --check 5ab19cbf2e4be2eec532054fb2e2d58c01f6a527 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Invalid patch' }
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'pnpm install failed' }
      - name: Build workspace dependencies
        run: |
          pnpm --filter cms build:workspace-deps
          if ($LASTEXITCODE -ne 0) { throw 'Workspace dependency build failed' }
      - name: Run focused master cache regression tests
        run: |
          pnpm --filter cms exec vitest run src/features/data-management/api/master-reference-cache.test.ts src/features/data-management/api/data-management-query-keys.test.ts src/features/textbook/lib/business-area-domain.test.ts src/features/textbook/lib/business-area-save-plan.test.ts src/features/program/general/api/adapters/general-program-adapters.test.ts src/features/program/general/lib/registration-payload-smoke.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'CMS master cache regression failed' }
      - name: CMS typecheck
        run: |
          pnpm --filter cms typecheck
          if ($LASTEXITCODE -ne 0) { throw 'CMS typecheck failed' }
      - name: CMS build without deployment
        run: |
          pnpm --filter cms build
          if ($LASTEXITCODE -ne 0) { throw 'CMS build failed' }
          if (-not (Test-Path -LiteralPath 'apps/cms/dist/index.html')) { throw 'Missing CMS build output' }
          Write-Host 'CMS_MASTER_CACHE_GATE=PASS|DEPLOYMENT=NONE'
