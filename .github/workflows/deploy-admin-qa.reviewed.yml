# REVIEWED CANDIDATE — DO NOT RUN until the dedicated IAM role exists
# and the Terraform/IaC ownership and rollback gates are approved.
name: Deploy Admin QA

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: admin-qa-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: '264015108093'
  AWS_ROLE_ARN: arn:aws:iam::264015108093:role/ja-prod-github-admin-qa-deploy-role
  ADMIN_BUCKET: ja-prod-frontend-admin-264015108093
  ADMIN_DISTRIBUTION_ID: E2DGTFXBDMZU0O
  ADMIN_ORIGIN: https://d2rdfkctvi6zhx.cloudfront.net
  VITE_API_BASE_URL: https://d3r1iaa0sy4tcq.cloudfront.net
  VITE_HOMEPAGE_API_BASE_URL: https://d388j6f4woncqy.cloudfront.net
  NODE_OPTIONS: --max-old-space-size=5120

jobs:
  deploy:
    name: Build and deploy QA Admin from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Verify pinned QA targets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$AWS_ROLE_ARN" = 'arn:aws:iam::264015108093:role/ja-prod-github-admin-qa-deploy-role'
          test "$ADMIN_BUCKET" = 'ja-prod-frontend-admin-264015108093'
          test "$ADMIN_DISTRIBUTION_ID" = 'E2DGTFXBDMZU0O'
          test "$VITE_API_BASE_URL" = 'https://d3r1iaa0sy4tcq.cloudfront.net'
          test "$VITE_HOMEPAGE_API_BASE_URL" = 'https://d388j6f4woncqy.cloudfront.net'
          echo "ADMIN_QA_COMMIT=$GITHUB_SHA"
          echo 'ADMIN_QA_TARGETS=PASS'

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Build Admin
        run: pnpm --filter admin build

      - name: Verify Admin build and API origins
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/admin/dist/index.html
          test -d apps/admin/dist/assets
          grep -RqlF "$VITE_API_BASE_URL" apps/admin/dist/assets
          grep -RqlF "$VITE_HOMEPAGE_API_BASE_URL" apps/admin/dist/assets
          echo 'ADMIN_QA_BUILD_AND_API_ORIGINS=PASS'

      - name: Assume QA Admin-only GitHub OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-admin-qa-deploy

      - name: Verify AWS account, bucket, versioning, CloudFront origin
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws s3api head-bucket --bucket "$ADMIN_BUCKET"
          test "$(aws s3api get-bucket-versioning --bucket "$ADMIN_BUCKET" --query Status --output text)" = Enabled
          CF_ORIGIN="$(aws cloudfront get-distribution --id "$ADMIN_DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.Origins.Items[?Id==`s3-admin`].DomainName | [0]' --output text)"
          test "$CF_ORIGIN" = "$ADMIN_BUCKET.s3.$AWS_REGION.amazonaws.com"
          test "$(aws cloudfront get-distribution --id "$ADMIN_DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.Enabled' --output text)" = True
          test "$(aws cloudfront get-distribution --id "$ADMIN_DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.DefaultCacheBehavior.TargetOriginId' --output text)" = s3-admin
          OLD_VERSION="$(aws s3api head-object --bucket "$ADMIN_BUCKET" --key index.html \
            --query VersionId --output text)"
          test -n "$OLD_VERSION" && test "$OLD_VERSION" != None
          echo "ADMIN_QA_PREDEPLOY_INDEX_VERSION=$OLD_VERSION"
          echo 'ADMIN_QA_AWS_TARGETS_AND_ROLLBACK_VERSION=PASS'

      - name: Upload new assets without deleting old versions
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync apps/admin/dist/ "s3://$ADMIN_BUCKET/" \
            --exclude 'index.html' \
            --no-progress \
            --cache-control 'public,max-age=0,must-revalidate'
          echo 'ADMIN_QA_ASSETS_UPLOADED=PASS'

      - name: Publish new index.html last
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp apps/admin/dist/index.html "s3://$ADMIN_BUCKET/index.html" \
            --no-progress \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8'
          echo 'ADMIN_QA_INDEX_PUBLISHED=PASS'

      - name: Invalidate QA Admin CloudFront
        shell: bash
        run: |
          set -euo pipefail
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$ADMIN_DISTRIBUTION_ID" \
            --paths '/*' --query 'Invalidation.Id' --output text)"
          test -n "$INVALIDATION_ID" && test "$INVALIDATION_ID" != None
          aws cloudfront wait invalidation-completed \
            --distribution-id "$ADMIN_DISTRIBUTION_ID" --id "$INVALIDATION_ID"
          echo 'ADMIN_QA_CF_INVALIDATION=PASS'

      - name: Verify public Admin entrypoint
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$ADMIN_ORIGIN/")"
          test "$STATUS" = 200
          echo 'ADMIN_QA_PUBLIC_ENTRYPOINT=PASS'
