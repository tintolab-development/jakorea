name: Deploy Portal QA

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portal-qa-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: '264015108093'
  AWS_ROLE_ARN: arn:aws:iam::264015108093:role/ja-prod-github-portal-qa-deploy-role
  QA_S3_BUCKET: ja-prod-frontend-platform-264015108093
  QA_CF_DISTRIBUTION_ID: E16QK1U83PRA5Z
  VITE_API_BASE_URL: https://d3r1iaa0sy4tcq.cloudfront.net
  VITE_HOMEPAGE_API_BASE_URL: https://d388j6f4woncqy.cloudfront.net
  VITE_OAUTH_BACKEND_ORIGIN: https://d3r1iaa0sy4tcq.cloudfront.net
  VITE_JUSO_ADDRESS_API_URL: https://business.juso.go.kr/addrlink/addrLinkApi.do
  NODE_OPTIONS: --max-old-space-size=5120

jobs:
  deploy:
    name: Build and deploy Portal QA from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Validate QA search configuration
        env:
          JUSO_KEY: ${{ secrets.VITE_ADDRESS_API_KEY }}
          NEIS_KEY: ${{ secrets.VITE_NEIS_API_KEY }}
          CAREER_KEY: ${{ secrets.VITE_CAREER_NET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JUSO_KEY" || { echo 'VITE_ADDRESS_API_KEY=MISSING'; exit 1; }
          test -n "$NEIS_KEY" || { echo 'VITE_NEIS_API_KEY=MISSING'; exit 1; }
          test -n "$CAREER_KEY" || { echo 'VITE_CAREER_NET_API_KEY=MISSING'; exit 1; }
          echo 'QA_PORTAL_SEARCH_SECRETS=SET'

      - name: Build Portal QA
        env:
          VITE_ADDRESS_API_KEY: ${{ secrets.VITE_ADDRESS_API_KEY }}
          VITE_NEIS_API_KEY: ${{ secrets.VITE_NEIS_API_KEY }}
          VITE_CAREER_NET_API_KEY: ${{ secrets.VITE_CAREER_NET_API_KEY }}
        run: pnpm --filter platform build

      - name: Check built API destinations
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/platform/dist/index.html
          grep -RqlF "$VITE_API_BASE_URL" apps/platform/dist/assets
          grep -RqlF "$VITE_HOMEPAGE_API_BASE_URL" apps/platform/dist/assets
          echo 'QA_PORTAL_BUNDLE_API_ORIGINS=PASS'

      - name: Configure QA AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-portal-qa-deploy

      - name: Verify AWS deployment account
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          echo 'QA_PORTAL_AWS_IDENTITY=PASS'

      - name: Upload assets before index.html
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync apps/platform/dist/ "s3://$QA_S3_BUCKET/" \
            --exclude 'index.html' \
            --no-progress \
            --cache-control 'public,max-age=0,must-revalidate'
          aws s3 cp apps/platform/dist/index.html "s3://$QA_S3_BUCKET/index.html" \
            --no-progress \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8'
          echo 'QA_PORTAL_S3_DEPLOY=PASS'

      - name: Invalidate QA CloudFront
        shell: bash
        run: |
          set -euo pipefail
          INV_ID="$(aws cloudfront create-invalidation \
            --distribution-id "$QA_CF_DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)"
          test -n "$INV_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$QA_CF_DISTRIBUTION_ID" \
            --id "$INV_ID"
          echo 'QA_PORTAL_CF_INVALIDATION=PASS'
