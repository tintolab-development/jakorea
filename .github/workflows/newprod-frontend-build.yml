name: NEW PROD Frontend Parallel Build and Deploy
on:
  workflow_dispatch:
    inputs:
      homepage_api_base_url:
        description: "NEW PROD JAHOMEADMINBACK HTTPS CloudFront URL"
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: newprod-frontend-deploy
  cancel-in-progress: false
env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "264015108093"
  AWS_ROLE_ARN: arn:aws:iam::264015108093:role/ja-newprod-frontend-github-deploy
  VITE_API_BASE_URL: https://d2yfe3hmramof9.cloudfront.net
  VITE_OAUTH_BACKEND_ORIGIN: https://d2yfe3hmramof9.cloudfront.net
  VITE_JUSO_ADDRESS_API_URL: https://business.juso.go.kr/addrlink/addrLinkApi.do
  NODE_OPTIONS: --max-old-space-size=5120
jobs:
  deploy:
    name: Build and deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: cms
            output: apps/cms/dist
            bucket_output: CmsBucket
            distribution_output: CmsDistributionId
          - app: platform
            output: apps/platform/dist
            bucket_output: PlatformBucket
            distribution_output: PlatformDistributionId
          - app: admin
            output: apps/admin/dist
            bucket_output: AdminBucket
            distribution_output: AdminDistributionId
    steps:
      - name: Guard deployment branch and homepage HTTPS origin
        shell: bash
        env:
          HOMEPAGE_API: ${{ inputs.homepage_api_base_url }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/deploy/newprod"
          case "$HOMEPAGE_API" in https://*) ;; *) echo "HOMEPAGE_API_MUST_BE_HTTPS"; exit 1 ;; esac
          case "$HOMEPAGE_API" in *localhost*|*127.0.0.1*|*pending.invalid*) echo "INVALID_HOMEPAGE_API_ORIGIN"; exit 1 ;; esac
          echo "NEWPROD_FRONTEND_DEPLOY_GUARD=PASS"
      - name: Checkout pinned NEW PROD commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Install locked dependencies
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile
      - name: Configure NEW PROD AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-newprod-${{ matrix.app }}-deploy
      - name: Verify account and load NEW PROD targets
        id: targets
        shell: bash
        env:
          HOMEPAGE_API: ${{ inputs.homepage_api_base_url }}
          BUCKET_OUTPUT: ${{ matrix.bucket_output }}
          DISTRIBUTION_OUTPUT: ${{ matrix.distribution_output }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          OUTPUTS="$(aws cloudformation describe-stacks --stack-name ja-newprod-frontend-static --query 'Stacks[0].Outputs' --output json)"
          get_output() { jq -er --arg key "$1" '.[] | select(.OutputKey == $key) | .OutputValue' <<< "$OUTPUTS"; }
          BUCKET="$(get_output "$BUCKET_OUTPUT")"
          DISTRIBUTION_ID="$(get_output "$DISTRIBUTION_OUTPUT")"
          CMS_ORIGIN="https://$(get_output CmsDomain)"
          PLATFORM_ORIGIN="https://$(get_output PlatformDomain)"
          test -n "$BUCKET"
          test -n "$DISTRIBUTION_ID"
          {
            echo "DEPLOY_BUCKET=$BUCKET"
            echo "DISTRIBUTION_ID=$DISTRIBUTION_ID"
            echo "CMS_ORIGIN=$CMS_ORIGIN"
            echo "PLATFORM_ORIGIN=$PLATFORM_ORIGIN"
            echo "HOMEPAGE_API=$HOMEPAGE_API"
          } >> "$GITHUB_ENV"
          {
            echo "cms_origin=$CMS_ORIGIN"
            echo "platform_origin=$PLATFORM_ORIGIN"
          } >> "$GITHUB_OUTPUT"
          echo "NEWPROD_AWS_TARGETS=PASS"
      - name: Build CMS
        if: matrix.app == 'cms'
        env:
          VITE_ADDRESS_API_KEY: ${{ secrets.VITE_ADDRESS_API_KEY }}
          VITE_NEIS_API_KEY: ${{ secrets.VITE_NEIS_API_KEY }}
          VITE_CAREER_NET_API_KEY: ${{ secrets.VITE_CAREER_NET_API_KEY }}
          VITE_NAVER_CLIENT_ID: ${{ secrets.VITE_NAVER_CLIENT_ID }}
          VITE_PLATFORM_PUBLIC_ORIGIN: ${{ steps.targets.outputs.platform_origin }}
        run: pnpm --filter cms build
      - name: Build Platform
        if: matrix.app == 'platform'
        env:
          VITE_ADDRESS_API_KEY: ${{ secrets.VITE_ADDRESS_API_KEY }}
          VITE_NEIS_API_KEY: ${{ secrets.VITE_NEIS_API_KEY }}
          VITE_CAREER_NET_API_KEY: ${{ secrets.VITE_CAREER_NET_API_KEY }}
          VITE_PLATFORM_NAVER_CLIENT_ID: ${{ secrets.VITE_PLATFORM_NAVER_CLIENT_ID }}
          VITE_HOMEPAGE_API_BASE_URL: ${{ inputs.homepage_api_base_url }}
        run: pnpm --filter platform build
      - name: Build Homepage Admin
        if: matrix.app == 'admin'
        env:
          VITE_HOMEPAGE_API_BASE_URL: ${{ inputs.homepage_api_base_url }}
          VITE_CMS_ORIGIN: ${{ steps.targets.outputs.cms_origin }}
          VITE_ADMIN_AUTH_API_PREFIX: /api/admin/auth
        run: pnpm --filter admin build
      - name: Verify build output and NEW PROD API wiring
        shell: bash
        env:
          APP_OUTPUT: ${{ matrix.output }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          test -s "$APP_OUTPUT/index.html"
          test -d "$APP_OUTPUT/assets"
          if [[ "$APP" == "platform" || "$APP" == "admin" ]]; then
            grep -RqlF "$HOMEPAGE_API" "$APP_OUTPUT/assets"
          fi
          echo "APP_BUILD_AND_ORIGIN_CHECK=$APP:PASS"
      - name: Upload assets before index.html
        shell: bash
        env:
          APP_OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          aws s3 sync "$APP_OUTPUT/" "s3://$DEPLOY_BUCKET/" --exclude "index.html" --no-progress --cache-control "public,max-age=300"
          echo "ASSETS_UPLOAD=PASS"
      - name: Publish index.html last
        shell: bash
        env:
          APP_OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          aws s3 cp "$APP_OUTPUT/index.html" "s3://$DEPLOY_BUCKET/index.html" --no-progress --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html; charset=utf-8"
          echo "INDEX_PUBLISH=PASS"
      - name: Invalidate NEW PROD CloudFront
        shell: bash
        run: |
          set -euo pipefail
          INVALIDATION_ID="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$INVALIDATION_ID"
          echo "CLOUDFRONT_INVALIDATION=PASS"
      - name: Verify public HTTPS entrypoint
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" --query 'Distribution.DomainName' --output text)"
          STATUS="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://$DOMAIN/")"
          test "$STATUS" = "200"
          echo "HTTPS_ENTRYPOINT=PASS"
          echo "URL=https://$DOMAIN/"
