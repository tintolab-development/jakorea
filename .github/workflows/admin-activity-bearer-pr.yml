name: Admin Activity bearer auth regression

on:
  pull_request:
    branches: [main, jiwon]
    paths:
      - 'apps/cms/src/shared/instance/axios-instance.ts'
      - 'apps/admin/src/shared/instance/axios-instance.ts'
      - 'apps/cms/src/shared/instance/axios-instance.activity-bearer.test.ts'
      - 'apps/cms/src/shared/instance/axios-instance.activity-session.test.ts'
      - '.github/workflows/admin-activity-bearer-pr.yml'

permissions:
  contents: read

jobs:
  admin-activity-bearer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: pnpm
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Build CMS workspace dependencies
        run: pnpm --filter cms build:workspace-deps
      - name: Activity Bearer and Refresh regression tests
        run: |
          pnpm --filter cms exec vitest run \
            src/shared/instance/axios-instance.activity-bearer.test.ts \
            src/shared/instance/axios-instance.refresh-lock.test.ts
      - name: Ensure both interceptors separate Bearer and Refresh exclusion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for app in ("cms", "admin"):
              code = Path(f"apps/{app}/src/shared/instance/axios-instance.ts").read_text()
              assert "retryable.skipAuth || isExcludedFromBearerAuth(url)" in code, app
              assert "isExcludedFromBearerAuth(url) || path === `${adminAuthPaths.prefix}/activity`" in code, app
              header_fn = code.split("function isExcludedFromBearerAuth(", 1)[1].split("\n}", 1)[0]
              assert "path.includes(`${prefix}/activity`)" not in header_fn, app
              print(f"ADMIN_ACTIVITY_BEARER=PASS|{app}")
          PY
